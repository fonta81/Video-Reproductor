<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <main class="player-layout">

    <div class="video-container" id="videoContainer">
      <video id="mainVideo" preload="metadata" playsinline></video>

      <!-- Click area to play/pause -->
      <div class="video-overlay" id="videoOverlay"></div>

      <!-- Big center play button -->
      <button class="big-play-btn" id="bigPlayBtn" aria-label="Play video">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </button>

      <!-- Buffering spinner -->
      <div class="spinner hidden" id="spinner" aria-label="Loading"></div>

      <!-- Error message -->
      <div class="error-message hidden" id="errorMessage">
        <p>Sorry, this video could not be loaded.</p>
        <button class="retry-btn" id="retryBtn">Try again</button>
      </div>

      <!-- Custom controls -->
      <div class="controls-container" id="controlsContainer">
        <div class="progress-bar-container" id="progressContainer">
          <div class="buffer-bar" id="bufferBar"></div>
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <!-- Previous video -->
            <button class="control-btn" id="prevBtn" title="Previous video (P)">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <rect x="5" y="4" width="3" height="16"></rect>
              </svg>
            </button>

            <button class="control-btn" id="playPauseBtn" title="Play/Pause (Space / K)">
              <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </button>

            <!-- Next video -->
            <button class="control-btn" id="nextBtn" title="Next video (N)">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <rect x="16" y="4" width="3" height="16"></rect>
              </svg>
            </button>

            <div class="volume-container">
              <button class="control-btn" id="muteBtn" title="Mute (M)">
                <svg id="volumeHighIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="volumeMuteIcon" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <line x1="23" y1="9" x2="17" y2="15"></line>
                  <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
              </button>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="time-display">
              <span id="currentTime">00:00</span> / <span id="duration">00:00</span>
            </div>
          </div>

          <div class="controls-right">
            <!-- Repeat / loop (cycles: off → one → all) -->
            <button class="control-btn loop-btn" id="loopBtn" title="Repeat: off (L)" aria-pressed="false" aria-label="Toggle repeat mode">
              <!-- Repeat (used for "off" and "all") -->
              <svg id="loopIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m17 2 4 4-4 4"></path>
                <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
                <path d="m7 22-4-4 4-4"></path>
                <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
              </svg>
              <!-- Repeat one (with the "1") -->
              <svg id="loopOneIcon" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m17 2 4 4-4 4"></path>
                <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
                <path d="m7 22-4-4 4-4"></path>
                <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
                <path d="M11 10h1v4"></path>
              </svg>
            </button>
            <button class="control-btn" id="fullscreenBtn" title="Fullscreen (F)">
              <svg id="fullscreenExpandIcon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
              <svg id="fullscreenCompressIcon" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Now playing + playlist -->
    <section class="switcher">
      <div class="switcher-header">
        <div>
          <span class="now-playing-label">Now playing</span>
          <h1 class="now-playing-title" id="videoTitle"></h1>
        </div>
        <label class="autoplay-toggle">
          <input type="checkbox" id="autoplayNext" checked>
          <span>Autoplay next</span>
        </label>
      </div>

      <!-- Filled automatically from the VIDEOS array in js.js -->
      <ul class="playlist" id="playlist"></ul>
    </section>

  </main>

  <script src="./js/js.js"></script>
</body>
</html>
